<!DOCTYPE html>
<html>
<head>
    <title>Status Update</title>
</head>
<body>
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
    {% for request in requests %}
        <form method="post" action="">
            {% csrf_token %}
            <input type="hidden" name="request_id" value="{{ request.id }}">
            <p>{{ request.student.email }} - {{ request.document_type }}</p>
            <label>Payment: <input type="checkbox" name="payment" {% if request.payment %}checked{% endif %}></label>
            <label>Document: <input type="checkbox" name="document" {% if request.document %}checked{% endif %}></label>
            <button type="submit">Update</button>
        </form>
    {% endfor %}
</body>
</html>
